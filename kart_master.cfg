# =============================================================================
# kart_master.cfg - THE control file for the Maveric 2D map maker + drive stack
# =============================================================================
#
# One file controls everything: which sensors are read, how the camera is
# configured, how the map is built, how the kart drives, and the safety
# limits. INI style: [section] then key = value. '#' starts a comment (full
# line, or after the value with a space before the '#'). The file is read
# ONCE at node startup - editing it while a node runs changes nothing until
# a restart. Two knobs are additionally live ROS parameters while driving:
#   ros2 param set /drive max_speed_mps 1.0
#   ros2 param set /drive speed_scale 0.5
#
# Validation runs before anything starts: typos get a did-you-mean with the
# line number, out-of-range values name the allowed range, and impossible
# sensor combinations are refused with the fix. Check without starting:
#   ros2 run kart_map2d check_cfg kart_master.cfg
#
# Launch arguments can flip any [sensors] switch without editing this file:
#   ros2 launch kart_map2d mapping.launch.py cfg:=... lidar:=1
#
# Keys marked SAFETY change how fast the kart can move or when it stops.
# Change them only while testing on stands, one at a time.
# =============================================================================


[sensors]
# 1 = read this input, 0 = never subscribe to it. These switches are the
# single source of truth for BOTH the live mapping node and the drive node,
# and for the offline replay runner (tools/replay_run.py), whose output
# folders are named after the enabled combination (e.g. outputs/<run>__imu+cam)
# so experiments never overwrite each other.
#
# SHIPPED DEFAULT = the kart's target configuration: ONE camera + the
# dedicated IMU, nothing else. The camera is the only visual input.

# The dedicated IMU sensor (/imu/data by default, 400 Hz, frame imu_link).
# What it does: the inertial backbone - orientation rate, stillness (ZUPT),
#   the VO yaw prior, the arrival clock of the whole fusion engine.
# Off: the EKF loses its inertial core; VO loses its yaw prior; mapping
#   still runs but degrades badly. Leave at 1 unless bench-testing.
# NEVER a camera's built-in IMU: the node subscribes exactly [imu] topic and
#   nothing else (the code has no parameter that could read a camera IMU).
imu = 1

# The primary camera ([camera] section below).
# What it does: visual odometry (position without wheel slip) + the ONLY
#   default source of drivable/obstacle map evidence.
# Off: no map evidence unless lidar = 1; localization falls back to the
#   remaining odometric sources. CPU: each camera costs a VO solve
#   (~100-350 ms on a worker, does not block control) + segmentation
#   (~8 ms/frame classical).
camera = 1

# A SECOND camera ([camera_2] section) - comparison tests only.
# The kart target is ONE camera; enable this to A/B a second mount or lens.
# Costs a second VO worker + segmentation stream (roughly doubles camera CPU).
camera_2 = 0

# 2D LiDAR evidence - STRICTLY an off-by-default experiment switch.
# What it does when 1: point clouds from [lidar] topic are flattened into
#   extra drivable/obstacle evidence for the SAME 2D grid, and the drive
#   node gains scan-to-map fixes + LiDAR obstacle stops. There is NO 3D
#   twin in this package (that lives in the research workspace).
# The camera remains the primary visual input either way.
lidar = 0

# The kart's own odometry topic (nav_msgs/Odometry on [odom] topic).
# What it does: body-frame increments, a strong odometric channel.
# Off (default): the September kart publishes /odom from its LiDAR stack;
#   a bare kart usually has nothing to publish here.
odom = 0

# The Livox LiDAR's built-in IMU - available but OFF by the user's decision.
# When 1: a second inertial channel (redundancy if the dedicated IMU dies).
# Uses [imu] livox_* keys for topic/units/mount.
livox_imu = 0

# Magnetometer (sensor_msgs/MagneticField on [magnetometer] topic).
# What it does when 1: absolute heading (channel "mag") - stops slow yaw
#   drift on long one-way drives. REQUIRES [magnetometer] calibration_file
#   (hard/soft-iron, from tools/calibrate_magnetometer.py); refuses to start
#   without one and prints the exact recording procedure.
# Not validated on real data yet: the September recordings carry no
#   magnetometer. First real validation happens when you record one.
magnetometer = 0

# Speedometer (std_msgs/Float32 m/s or geometry_msgs/TwistStamped, see
# [speedometer]). Forward speed -> channel "speedometer".
# Same honesty note as the magnetometer: synthetic validation only so far.
speedometer = 0

# Wheel encoder ticks (std_msgs/Int64 counter or sensor_msgs/JointState,
# see [wheel_ticks]) -> speed with a quantization-aware sigma.
# Same honesty note: synthetic validation only so far.
wheel_ticks = 0

# GNSS - NOT IMPLEMENTED. Setting 1 stops with a clear message instead of
# pretending to fuse a sensor that has no adapter. Keep 0.
gnss = 0


[camera]
# The PRIMARY camera. Everything here is camera-agnostic: nothing assumes a
# ZED or any other make. See also README.md "Bringing up a new camera".

# Internal name for this camera (folder names, channels "vo_<name>", logs).
name = camera

# Where frames come from:
#   ros2      - subscribe image_topic (+ camera_info_topic or calibration_file)
#   device    - cv2.VideoCapture: a V4L2 index ("0"), a device path
#               ("/dev/video0"), or a VIDEO FILE for testing. No ROS image
#               topics are subscribed. Needs calibration_file. Frames are
#               stamped at capture from the node clock; the driver buffer
#               (~1 frame) is not corrected for. A video FILE replays at
#               its own pace (its fps metadata, or a <file>.stamps.csv
#               sidecar from tools/frames_to_video.py; under use_sim_time
#               the sidecar reproduces the recorded timeline exactly),
#               and capture waits for a valid clock before the first read.
#   gstreamer - a GStreamer pipeline string (Orin CSI port). Needs
#               calibration_file. HONEST NOTE: pip opencv-python-headless has
#               NO GStreamer support - on the Orin install apt python3-opencv
#               for this mode. device/file capture works with either build.
source = ros2

# ROS topics (source = ros2). Any sensor_msgs/Image encoding among
# bgr8, rgb8, bgra8, rgba8, mono8 is accepted; compressed = 1 switches the
# image topic to sensor_msgs/CompressedImage (jpeg/png).
image_topic = /zed_right/zed_lean_camera_node/rgb/image_rect_color
camera_info_topic = /zed_right/zed_lean_camera_node/rgb/camera_info
compressed = 0

# Intrinsics + lens distortion from a YAML file (kart_map2d/camera/model.py
# format; tools/dump_camera_info.py writes one from a live camera_info topic).
# Required for source = device / gstreamer; optional override for ros2.
# Distortion models plumb_bob / rational_polynomial / equidistant are
# handled by undistorting POINTS and precomputed ray tables only - full
# frames are never warped (compute budget).
calibration_file =

# Extrinsics.
#   frame =            (empty) use the MANUAL mount below - the default and
#                      the proven September configuration.
#   frame = auto       look the camera up in TF via the image header's
#                      frame_id (needs the URDF/driver to publish it).
#   frame = <name>     look up that TF frame explicitly.
# A TF frame containing "optical" is used as-is (REP-103); any other frame
# is treated as the camera BODY link with the standard forward-optical
# convention applied on top - no camera make, no flip assumption. When the
# lookup fails the node warns once and uses the manual mount, which is the
# always-available fallback: position of the optical centre in base_link [m]
# and body roll/pitch/yaw [deg] (pitch > 0 looks down; 0,0,0 = level,
# straight ahead).
frame =
mount_xyz = -0.06, -0.27, 0.462
mount_rpy_deg = 0, 0, 0

# Calibrated camera height over the ground [m] - THE monocular scale anchor.
# Wrong height = wrongly scaled map (corridor widths, distances, speeds).
# Empty = use mount z over the nominal ground plane (rough; calibrate!).
# Calibration procedure (any camera, no ZED assumption): README.md
# "Calibrating the camera height" - drive a straight, tape-measured
# distance, compare the mapped distance, scale height by true/estimated,
# repeat once. September rig: zed_right 0.445, zed_left 0.545.
height_m = 0.445

# Kart-body mask: which pixels show the kart itself (chassis, wheels).
# mask_file: a PNG (white = kart) at full camera resolution; empty = none.
# learn_mask = 1: auto-learn the mask from temporally static pixels while
#   driving (~24 s of frames, then a one-time ~1 s learn on the mapping
#   worker; the proven classical-fix learner). Until learned - or if
#   learning refuses - a conservative geometric default applies.
# Why it matters: an unmasked kart body gets labelled obstacle and paints a
#   false obstacle ring beside the path in every frame (this exact failure
#   pinched the research corridor from 1.4 m to 0.2 m before the fix).
mask_file =
learn_mask = 1

# Driver start (source = ros2 only): none | usb_cam | zed.
#   none    - you start the camera driver yourself (or a bag publishes).
#   usb_cam - mapping.launch.py starts a usb_cam node on `device` with
#             driver_width x driver_height @ driver_fps, remapped to the
#             topics above. These three keys apply ONLY here and to
#             source = device capture requests.
#   zed     - refused with instructions: vendor driver stacks are launched
#             by their own launch files, not wrapped by this package.
driver = none
driver_fps = 15
driver_width = 1920
driver_height = 1200

# device / gstreamer source settings (ignored for ros2):
device = 0
gstreamer_pipeline =

# Processing scale: incoming frames are resized by this factor ONCE before
# VO + segmentation (0.05..1.0). Lower = less CPU + latency, fewer far-field
# pixels (shorter mapping range); higher = sharper masks, more CPU. 0.5 on
# 1920x1200 gives the proven 960x600 pipeline. Empty [segmentation] scale is
# the global default; this key overrides it per camera.
# MEASURED per frame on the validation laptop (sept3 1920x1200 frames,
# classical seg + camera grid insert at cell 0.15; results/latency_settings.json):
#   scale 0.25:  seg  6.4 ms,  insert  15.7 ms
#   scale 0.5 :  seg  7.7 ms,  insert  55.8 ms   (shipped default)
#   scale 0.75:  seg 17.9 ms,  insert 111.7 ms   (upsample-approximated)
#   scale 1.0 :  seg 20.4 ms,  insert 200.2 ms   (upsample-approximated)
# Orin: measure on device - run one mapping session (ros2 launch kart_map2d
# mapping.launch.py), save, and read latency_ms_mean_p95_max in the map
# package's live_stats.json.
processing_scale = 0.5

# Non-ROS sources only: cap delivered frames per second (0 = every frame).
# A video file replayed with 0 floods the pipeline as fast as it decodes;
# cap to the recorded fps for realistic timing.
max_process_rate_hz = 0


[camera_2]
# The optional comparison camera ([sensors] camera_2 = 1). Same keys as
# [camera]; defaults describe the September left ZED channel so an A/B test
# on the recordings works out of the box.
name = camera_2
source = ros2
image_topic = /zed_left/zed_lean_camera_node/rgb/image_rect_color
camera_info_topic = /zed_left/zed_lean_camera_node/rgb/camera_info
compressed = 0
calibration_file =
frame =
mount_xyz = -0.06, 0.27, 0.462
mount_rpy_deg = 0, 0, 0
height_m = 0.545
mask_file =
learn_mask = 1
driver = none
driver_fps = 15
driver_width = 1920
driver_height = 1200
device = 0
gstreamer_pipeline =
processing_scale = 0.5
max_process_rate_hz = 0


[imu]
# The dedicated IMU ([sensors] imu). Device-clock stamps (starting near 0 s)
# are corrected online by the proven streaming clock sync - do not
# "pre-correct" them in a driver.

# The topic (sensor_msgs/Imu). A parameter, not an assumption.
topic = /imu/data

# The IMU's TF frame. The kart's own /tf_static lacks imu_link, so the
# launch files publish a static base_link -> <frame> transform themselves:
# identity ROTATION (verified from data by gyro cross-correlation on the
# September recordings) at position mount_xyz below.
frame = imu_link
mount_xyz = 0, 0, 0

# Decimation rate in front of the EKF [Hz], 10..400. The 400 Hz stream is
# block-averaged to this rate (also the anti-alias filter). 100 is the
# offline-verified value; higher buys nothing measurable and costs EKF CPU,
# lower loses dynamics during sharp turns.
rate_hz = 100

# Livox built-in IMU ([sensors] livox_imu = 1). The driver reports
# acceleration in g (livox_accel_in_g = 1 converts); mount = base_link <-
# livox frame (shared with [lidar] when both point at the same unit).
livox_topic = /livox/imu
livox_accel_in_g = 1
livox_xyz = 0, 0, 0.52
livox_rpy_deg = 0, 0, -90


[lidar]
# 2D LiDAR grid evidence ([sensors] lidar = 1) - experiment switch, see
# [sensors]. Points are transformed by the mount below, flattened, and
# fused into the same evidence grid the camera feeds.
topic = /livox/lidar
xyz = 0, 0, 0.52
rpy_deg = 0, 0, -90


[odom]
# The kart's own odometry ([sensors] odom = 1).
topic = /odom
# Poses per increment (1..20). 2 = the offline-verified stride: per-pose
# jitter is constant, so longer increments carry proportionally less speed
# noise; higher smooths more but reacts slower to real accelerations.
stride = 2


[odometry]
# Visual-odometry tuning (per camera). These trade CPU per solve against
# robustness; the defaults are the values every research number was
# measured with. Touch only with a reason.

# ORB descriptor budget for the wide-baseline fallback matcher (200..20000).
# Higher = more matches on blurry/low-texture frames, linearly more CPU.
# MEASURED ms/solve at 960x600 on the validation laptop (28 sept3 frame
# pairs, orb_features/max_corners together; results/latency_settings.json):
#   1000/500:  mean 62.0, p95  82.0    3000/1500 (default): mean 51.2, p95 119.7
#   8000/4000: mean 69.2, p95 279.8   (all three solved the same 22 pairs;
#   the default's LK path is cheapest on average - the budget mostly moves
#   the p95 of hard, blurry frames). Orin: measure on device via the map
#   package's live_stats.json (vo_solve row) after a mapping session.
orb_features = 3000

# Max corners for the primary LK tracker (100..10000). Same trade as above.
max_corners = 1500

# Min pixel spacing between tracked corners (1..100 px). Lower packs
# features tighter (more matches, more CPU, more redundancy); higher
# spreads them (fewer, better-conditioned).
feature_spacing_px = 10

# Frame pairs closer than this [s] are merged (0..2). 0.09 matches the
# recordings' near-duplicate gaps; raising it discards genuinely distinct
# frames at high fps (less VO input), lowering it wastes solves on jitter.
min_pair_dt_s = 0.09


[magnetometer]
# All keys used only when [sensors] magnetometer = 1.
topic = /mag

# Hard/soft-iron calibration YAML - REQUIRED (the node refuses to start
# without it and prints the recording procedure). Produce it with:
#   python tools/calibrate_magnetometer.py --bag <bag> --topic /mag --out config/mag_calibration.yaml
calibration_file =

# Local magnetic declination [deg, east positive], -45..45. Look it up for
# the operating site (NOAA calculator). Wrong declination = constant
# heading bias = slowly bending long straight drives.
declination_deg = 0

# Sensor yaw on the kart [deg, -180..180]: how the sensor x axis is rotated
# CCW from base_link x (forward).
mount_yaw_deg = 0

# 1-sigma heading noise [deg], 0.5..60. Lower makes the EKF trust magnetic
# heading harder (faster drift correction, but a disturbance pulls harder);
# higher softens it. 8 deg suits a campus environment with light steel.
# A persistently wrong heading is caught twice over: the innovation gate
# (30 consecutive rejects fault the channel) AND the mag-gyro consistency
# check - over every turn the mag's total heading change must agree with
# the gyro's integrated turn within 20 deg (a wrong hard/soft-iron
# calibration warps heading DURING turns, which the innovation gate alone
# misses once the EKF has converged onto the smoothly-wrong heading;
# measured live: 573/603 bad measurements accepted without the check).
# VALIDATION-ARMED TRUST: with the IMU present, magnetic headings are only
# fused after the first turn has agreed with the gyro, and a single
# contradicted turn excludes the mag for the rest of the run (the node
# tells you to recalibrate). On a straight a wrong calibration is
# indistinguishable from a mount offset, so arming costs the drive up to
# its first substantial turn (>= 20 deg within 10 s; measured on sept3 the
# first such window completes at t=39 s because the route is straight-
# heavy - the mag then still cut the final yaw drift to 0.5 deg).
sigma_deg = 8

# Fused heading rate [Hz], 0.5..200 (measurements beyond this are decimated).
# Absolute heading needs no 100 Hz; 20 keeps EKF cost negligible.
rate_hz = 20


[speedometer]
# All keys used only when [sensors] speedometer = 1.
topic = /speed
# float32 (std_msgs/Float32, m/s, stamped at receive - no header) or
# twist_stamped (geometry_msgs/TwistStamped, twist.linear.x, header stamp).
type = float32
# 1-sigma speed noise [m/s], 0.005..5. Lower = EKF leans on the speedometer
# (good hardware only); higher = gentle prior.
sigma_mps = 0.15


[wheel_ticks]
# All keys used only when [sensors] wheel_ticks = 1.
topic = /wheel_ticks
# int64 (std_msgs/Int64 cumulative count, stamped at receive) or
# joint_state (sensor_msgs/JointState position of `joint`, header stamp).
type = int64
joint =
# Encoder ticks per metre of travel (1..1e6). Measure: push the kart a
# taped 10 m, divide the tick delta by 10. Wrong value = wrongly scaled
# speed = map scale fights the camera.
ticks_per_metre = 1000
# Nominal publish rate [Hz] (1..1000) - documentation/validation only; the
# adapter derives dt from the stamps themselves.
publish_rate_hz = 50
# Sigma floor [m/s], 0.001..2. The adapter ADDS the +-2-tick quantization
# term sqrt-wise on top: at low speed / high rate the quantization
# dominates automatically. Floor covers slip + tyre radius error.
sigma_floor_mps = 0.05


[segmentation]
# classical - zero-network, torch-free, ~8 ms/frame at 960x600. THE DEFAULT.
# neural    - SegFormer-B0 (needs torch + transformers + the checkpoint;
#             on the Orin use NVIDIA's torch wheel, requirements/orin-neural.txt).
#             Better far-field semantics, GPU cost, ~2 GB extra memory.
# auto      - neural when installed + checkpoint on disk, else classical.
mode = classical

# Mapping tick rate [Hz], 0.1..20: per tick, per camera, the newest frame
# with a trusted pose is segmented and fused. Higher = denser map evidence
# + more CPU on the mapping worker (never the control path); lower = sparser
# map. 2 Hz (a frame every 0.5 s) is the live-verified rate.
# MEASURED cost per tick at the shipped defaults (scale 0.5, cell 0.15,
# laptop): segment 7.7 ms + insert 55.8 ms = ~64 ms, so 2 Hz = ~13% of one
# core; 4 Hz = ~25%. Orin: measure on device via live_stats.json
# (segment + grid_camera_insert rows) after a mapping session.
rate_hz = 2

# Global processing scale (see [camera] processing_scale, which overrides
# per camera, and carries the measured per-scale ms table). 0.05..1.0.
scale = 0.5


[mapping]
# Grid cell size [m], 0.02..1.0. Smaller = crisper obstacles + more memory
# + slower inserts (cells scale ~1/cell^2); larger = coarser corridor.
# 0.15 is the value every research accuracy number used.
# MEASURED on the validation laptop (scale 0.5, per camera insert / one
# corridor extract; results/latency_settings.json):
#   cell 0.10: insert 52.5 ms, corridor 4.1 ms
#   cell 0.15: insert 57.0 ms, corridor 1.0 ms   (shipped default)
#   cell 0.30: insert 44.6 ms, corridor 1.4 ms
# (insert cost is dominated by the per-pixel ground projection, not the
# cell count, until cells get very small - memory is what 0.10 really
# costs). Orin: measure on device via live_stats.json after a session.
cell_size_m = 0.15

# Camera evidence range [m], 3..60. Pixels whose ground projection is
# farther are ignored (too depth-noisy). Longer reaches further but smears
# facades; 18 m is the proven default.
max_range_m = 18

# Dynamic-obstacle half-life [s], 0.2..60: evidence for MOVING things
# (pedestrians, the dog) decays with this half-life instead of baking into
# the map. Shorter forgets faster (clean map, but a slow walker may fade
# between sightings); longer holds ghosts.
dynamic_half_life_s = 3

# Never emit camera obstacle contacts closer than this [m], 0..10 (the
# classical-fix guard: nearer projections are kart silhouette/shadow and
# move with the camera, fencing the kart in). 2.5 proven. Lowering it
# reintroduces the corridor-pinch failure mode; raising it delays first
# sighting of genuinely near obstacles (live safety owns those anyway).
min_contact_range_m = 2.5

# Loop closure at SAVE time (never per frame): detect revisits, snap the
# loop shut, re-grid at corrected poses. 1 = on (proven: 7 closures on
# sept3, corridor 1.46 m). 0 = save the raw EKF trajectory.
loop_closure = 1

# Where ~/save_map writes map packages (created if missing). Relative paths
# resolve against this cfg file's directory.
output_dir = outputs/maps_live

# Package name prefix: <map_name>_flat_<UTC timestamp>/.
map_name = live

# Also save a package when the node stops (Ctrl-C) - 1 recommended on the
# kart so a mapping lap is never lost by forgetting the service call.
save_on_shutdown = 1

# Corridor extraction: station spacing along the driven path [m], 0.1..5,
# and morphological closing of drivable pinholes [cells], 0..10.
corridor_spacing_m = 0.5
corridor_close_cells = 2


[drive]
# ABSOLUTE path to the map package folder (the one holding map_meta.json) -
# a live save or an offline pipeline output. Relative resolves against this
# cfg's directory. Empty refuses to drive.
map_package =

# SAFETY. Hard speed cap [m/s], 0..12. The safety supervisor enforces it
# every cycle no matter what the controller wants. First runs: 0.5 on
# stands, then raise stepwise. Live-settable: ros2 param set /drive max_speed_mps.
max_speed_mps = 2.0

# SAFETY. Global scale on the racing line's speed plan, 0..1. 0.5 = drive
# the plan at half speed. Live-settable like max_speed_mps.
speed_scale = 1.0

# Pure-pursuit base lookahead [m], 0.1..10 (grows with speed internally).
# Shorter = tighter tracking, twitchier steering; longer = smoother, cuts
# corners. 0.6 gave cross-track RMS 0.040 m at 2 m/s in the closed loop.
lookahead_base_m = 0.6

# Control loop rate [Hz], 5..200. 50 is the verified rate (control CPU p95
# ~1.3 ms/cycle); higher buys little on a kart, lower degrades stopping
# distance granularity (SAFETY-adjacent).
control_rate_hz = 50

# Command output: topic + type.
#   ackermann - ackermann_msgs/AckermannDriveStamped on command_topic (default)
#   twist     - geometry_msgs/Twist on command_topic (e.g. /cmd_vel bridges)
command_topic = /drive
command_type = ackermann

# Re-localize GLOBALLY (search the whole map) when the localizer loses
# track mid-drive, 0/1. What it affects: recovery behaviour + safety on
# self-similar courses. 1 = a lost kart searches the whole map - right
# when it may start anywhere. 0 = a lost kart only re-converges near its
# last good pose (the +-3 m camera/LiDAR match window) - RIGHT when the
# start pose is known (marked grid spot): on a longitudinally
# self-similar course a global search can lock onto the wrong stretch of
# track (measured in the closed-loop sim: a 23 m teleport accepted during
# one dropout; with 0 the kart re-converges locally instead). The safety
# layer stops the kart while unlocalized either way. Default 1 keeps the
# always-recover behaviour; set 0 for known-start driving on courses that
# repeat themselves.
global_relocalization = 1


[safety]
# SAFETY. Stop this far short of an obstacle on the path [m], 0..10 (on top
# of the modelled braking distance + reaction time). Larger = earlier,
# gentler stops; smaller = closer approaches. 0.5 verified in sim.
stop_distance_m = 0.5

# SAFETY. Max age of the localization pose before the kart stops [s],
# 0.02..5. 0.2 = ten control cycles at 50 Hz.
pose_timeout_s = 0.2

# SAFETY. Heartbeat deadman [s], 0..10; 0 disables. When > 0, something
# must publish std_msgs/Bool true on the drive node's heartbeat topic at
# least this often or the kart stops.
deadman_timeout_s = 0

# SAFETY. E-stop topic (std_msgs/Bool, LATCHED): true stops and latches;
# publishing false alone does NOT restart - ~/engage must be called again.
estop_topic = /estop


[system]
# Node log level: debug | info | warn | error.
log_level = info

# 1 ONLY for bag replays (the node then runs on the bag's clock; play the
# bag with --clock 200). 0 on the kart - with 1 and no /clock publisher
# nothing is fused (the node warns loudly about exactly this).
use_sim_time = 0
